[package]
name = "shelf-core"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Offline core for Shelf: catalog, launch plan, and playtime watch"
publish = false

[[bin]]
name = "shelf-core"
path = "src/main.rs"

[[bin]]
name = "shelf"
path = "src/bin/shelf.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tao = "0.30"
wry = "0.47"

